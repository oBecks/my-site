# Routes PR events to the Gemini review workflow.
# Adapted from google-github-actions/run-gemini-cli examples/workflows/gemini-dispatch,
# trimmed to PR review only: no issue triage, no general assistant, and no
# plan-execute (which needs contents: write).

name: "🔀 Gemini Dispatch"

on:
  pull_request:
    types:
      - "opened"
  pull_request_review_comment:
    types:
      - "created"
  pull_request_review:
    types:
      - "submitted"
  issue_comment:
    types:
      - "created"

defaults:
  run:
    shell: "bash"

jobs:
  dispatch:
    # PRs: only when not from a fork.
    # Comments: only `@gemini-cli ...` on a PR, from the owner or collaborators.
    if: |-
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.fork == false
      ) || (
        github.event.sender.type == 'User' &&
        (github.event_name != 'issue_comment' || github.event.issue.pull_request) &&
        startsWith(github.event.comment.body || github.event.review.body, '@gemini-cli') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association)
      )
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
    outputs:
      command: "${{ steps.extract_command.outputs.command }}"
      additional_context: "${{ steps.extract_command.outputs.additional_context }}"
    steps:
      - name: "Extract command"
        id: "extract_command"
        uses: "actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea" # ratchet:actions/github-script@v7
        env:
          EVENT_TYPE: "${{ github.event_name }}.${{ github.event.action }}"
          REQUEST: "${{ github.event.comment.body || github.event.review.body }}"
        with:
          script: |
            const eventType = process.env.EVENT_TYPE;
            const request = process.env.REQUEST ?? '';

            if (eventType === 'pull_request.opened') {
              core.setOutput('command', 'review');
            } else if (request.startsWith('@gemini-cli /review')) {
              core.setOutput('command', 'review');
              core.setOutput(
                'additional_context',
                request.replace(/^@gemini-cli \/review/, '').trim()
              );
            } else {
              core.setOutput('command', 'fallthrough');
            }

  review:
    needs: "dispatch"
    if: |-
      ${{ needs.dispatch.outputs.command == 'review' }}
    uses: "./.github/workflows/gemini-review.yml"
    permissions:
      contents: "read"
      issues: "write"
      pull-requests: "write"
    with:
      additional_context: "${{ needs.dispatch.outputs.additional_context }}"
    secrets: "inherit"

  fallthrough:
    needs:
      - "dispatch"
      - "review"
    if: |-
      ${{ always() && !cancelled() && (failure() || needs.dispatch.outputs.command == 'fallthrough') }}
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
      issues: "write"
      pull-requests: "write"
    steps:
      - name: "Send failure comment"
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          ISSUE_NUMBER: "${{ github.event.pull_request.number || github.event.issue.number }}"
          MESSAGE: |-
            🤖 Sorry @${{ github.actor }}, I couldn't handle that. Only `@gemini-cli /review` is supported here, or the review failed: [see the logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          REPOSITORY: "${{ github.repository }}"
        run: |-
          gh issue comment "${ISSUE_NUMBER}" \
            --body "${MESSAGE}" \
            --repo "${REPOSITORY}"
