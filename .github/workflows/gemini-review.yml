# Gemini reviews a PR and posts inline comments.
# Adapted from google-github-actions/run-gemini-cli examples/workflows/pr-review:
# API-key auth only (no GitHub App, no Google Cloud WIF, so no id-token), and
# the action and Gemini CLI pinned. Gemini gets no shell or file tools: only
# activate_skill (loads the review guidelines) plus reading the PR and writing
# a review. The repo and PR number are passed in the command because the
# extension's prompt expects them from env vars it can't read without a shell.

name: "🔎 Gemini Review"

on:
  workflow_call:
    inputs:
      additional_context:
        type: "string"
        description: "Any additional context from the request"
        required: false

concurrency:
  group: "${{ github.workflow }}-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}"
  cancel-in-progress: true

defaults:
  run:
    shell: "bash"

jobs:
  review:
    runs-on: "ubuntu-latest"
    timeout-minutes: 7
    permissions:
      contents: "read"
      issues: "write"
      pull-requests: "write"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8" # ratchet:actions/checkout@v6
        with:
          persist-credentials: "false"

      - name: "Prepare prompt context"
        run: |-
          mkdir -p .gemini
          jq -n \
            --arg repo "${REPOSITORY}" \
            --arg pr "${PULL_REQUEST_NUMBER}" \
            --arg context "${ADDITIONAL_CONTEXT}" \
            '{repository: $repo, pull_request_number: $pr, additional_context: $context}' > .gemini/context.json
        env:
          REPOSITORY: "${{ github.repository }}"
          PULL_REQUEST_NUMBER: "${{ github.event.pull_request.number || github.event.issue.number }}"
          ADDITIONAL_CONTEXT: "${{ inputs.additional_context }}"

      - name: "Run Gemini pull request review"
        uses: "google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489" # v0.1.22
        id: "gemini_pr_review"
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}"
        with:
          gemini_api_key: "${{ secrets.GEMINI_API_KEY }}"
          gemini_cli_version: "${{ vars.GEMINI_CLI_VERSION || '0.60.0' }}"
          gemini_debug: "${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}"
          gemini_model: "${{ vars.GEMINI_MODEL }}"
          upload_artifacts: "${{ vars.UPLOAD_ARTIFACTS }}"
          workflow_name: "gemini-review"
          # issue_comment triggers are issues to GitHub, so pass the PR number explicitly.
          github_pr_number: "${{ github.event.pull_request.number || github.event.issue.number }}"
          settings: |-
            {
              "model": {
                "maxSessionTurns": 25
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0"
                  ],
                  "includeTools": [
                    "add_comment_to_pending_review",
                    "pull_request_read",
                    "pull_request_review_write"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              },
              "tools": {
                "core": ["activate_skill"]
              }
            }
          extensions: |
            [
              "https://github.com/gemini-cli-extensions/code-review"
            ]
          prompt: "/pr-code-review Repository: ${{ github.repository }}. Pull request number: ${{ github.event.pull_request.number || github.event.issue.number }}. Additional user instructions: ${{ inputs.additional_context || 'none' }}"

      # run-gemini-cli exits 0 even when Gemini errors out, which leaves the PR
      # silently unreviewed. Fail here so the dispatcher posts a failure comment.
      - name: "Fail if Gemini reported an error"
        if: steps.gemini_pr_review.outputs.error != ''
        env:
          GEMINI_ERROR: "${{ steps.gemini_pr_review.outputs.error }}"
        run: |-
          echo "::error title=Gemini review failed::${GEMINI_ERROR}"
          exit 1
